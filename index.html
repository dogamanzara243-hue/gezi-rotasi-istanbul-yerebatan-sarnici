<!DOCTYPE html>
<html lang="tr" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="meta-title">Yerebatan Sarnıcı Rehberi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-900 text-slate-100 font-['Inter',sans-serif]">
  <header class="sticky top-0 z-50 backdrop-blur-md bg-slate-900/80 border-b border-slate-800">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
      <a href="https://dogamanzara243-hue.github.io/Gezi-rotas-/" class="inline-flex items-center px-4 py-2 rounded-xl text-sm font-medium bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700">
        <i class="fa-solid fa-house mr-2 text-amber-500"></i> Ana Sayfaya Dön
      </a>
      <button onclick="javascript:history.back()" class="inline-flex items-center px-4 py-2 rounded-xl text-sm font-medium bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700">
        <i class="fa-solid fa-arrow-left mr-2 text-amber-500"></i> Önceki Sayfaya Dön
      </button>
    </div>
  </header>
  <main class="max-w-7xl mx-auto px-4 py-8 space-y-12">
    <section class="relative rounded-3xl overflow-hidden shadow-2xl border border-slate-800">
      <div class="absolute inset-0 z-0">
        <img id="hero-image" src="" alt="Kapak" class="w-full h-full object-cover filter brightness-75">
        <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-950/40 to-transparent"></div>
      </div>
      <div class="relative z-10 p-6 sm:p-16 flex flex-col justify-end min-h-[480px]">
        <div class="inline-flex items-center px-3.5 py-1.5 rounded-full bg-amber-500/20 border border-amber-500/30 text-amber-300 text-sm font-medium w-fit mb-4">
          <i id="hero-badge-icon" class="mr-1.5"></i> <span id="hero-badge-text"></span>
        </div>
        <h1 id="hero-title" class="text-3xl sm:text-5xl font-extrabold text-white mb-3"></h1>
        <p id="hero-subtitle" class="text-lg text-slate-300 max-w-3xl mb-8"></p>
        <div id="hero-stats" class="grid grid-cols-2 md:grid-cols-4 gap-4 pt-6 border-t border-slate-700/50"></div>
      </div>
    </section>
    <section class="bg-slate-800/60 rounded-3xl p-6 sm:p-8 border border-slate-700 shadow-xl">
      <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-4">
        <h2 id="what-title" class="text-2xl font-bold text-white"></h2>
        <span id="what-badge" class="px-3 py-1 rounded-lg text-xs font-semibold bg-amber-500/20 text-amber-300 border border-amber-500/30 w-fit"></span>
      </div>
      <p id="what-desc" class="text-slate-300 text-lg leading-relaxed"></p>
    </section>
    <section class="bg-slate-800/40 rounded-3xl p-6 sm:p-10 border border-slate-700 shadow-lg space-y-6">
      <h2 id="guide-title" class="text-2xl sm:text-3xl font-bold text-white"></h2>
      <div id="guide-paragraphs" class="space-y-4 text-slate-300 text-lg leading-relaxed"></div>
    </section>
    <section class="space-y-6">
      <h2 class="text-2xl font-bold text-white">Neden Ziyaret Etmelisiniz?</h2>
      <div id="why-visit-grid" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div>
    </section>
    <section class="bg-slate-800 rounded-3xl p-6 sm:p-8 border border-slate-700 shadow-xl">
      <h2 class="text-2xl font-bold text-white mb-6"><i class="fa-solid fa-list-check mr-3 text-amber-500"></i> Öne Çıkan Detaylar</h2>
      <ul id="highlights-list" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></ul>
    </section>
    <section class="bg-slate-800/40 rounded-3xl p-6 sm:p-8 border border-slate-700 shadow-xl space-y-6">
      <h2 id="transport-title" class="text-2xl font-bold text-white"></h2>
      <p id="transport-desc" class="text-slate-400"></p>
      <ul id="transport-tips" class="space-y-3"></ul>
    </section>
    <section class="space-y-6">
      <h2 class="text-2xl font-bold text-white">Çevrede Nerede Kalınır?</h2>
      <div id="hotels-grid" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
    </section>
    <section class="space-y-6">
      <h2 class="text-2xl font-bold text-white">Yakınlarda Ne Yenir?</h2>
      <div id="restaurants-grid" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
    </section>
  </main>
  <footer class="mt-20 border-t border-slate-800 bg-slate-950 py-8 text-center text-slate-500 text-sm">
    <p>&copy; 2026 Gezi Rotası</p>
  </footer>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
